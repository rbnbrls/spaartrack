services:
  db:
    ports: !override
      - "55450:5432"
    volumes: !override
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
  api:
    ports: !override
      - "18090:8080"
    environment:
      APP_AUTH_MODE: synthetic
      SYNTHETIC_FIXTURE_KEY: local-test-fixture-only
  web:
    ports: !override
      - "30050:80"
  redis:
    ports: !override
      - "6390:6379"
  object-storage:
    ports: !override
      - "19050:9000"
      - "19051:9001"
  otel-collector:
    ports: !override
      - "24310:4317"
      - "24311:4318"
      - "28890:8889"
  prometheus:
    ports: !override
      - "25090:9090"
  grafana:
    ports: !override
      - "23001:3000"
