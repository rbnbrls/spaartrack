name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: spaartrack
          POSTGRES_USER: spaartrack
          POSTGRES_PASSWORD: ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spaartrack -d spaartrack"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://spaartrack:ci-password@localhost:5432/spaartrack
      REDIS_URL: redis://localhost:6379
      API_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.5
      - run: pnpm install --frozen-lockfile=true
      - name: Validate database schema
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/schema.sql
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Build API
        run: pnpm --filter @spaartrack/api build
      - name: Start API bootstrap
        run: |
          pnpm --filter @spaartrack/api start > /tmp/spaartrack-api.log 2>&1 &
          echo $! > /tmp/spaartrack-api.pid
          for attempt in $(seq 1 20); do curl --fail --silent http://localhost:8080/health/ready && break; sleep 1; done
          curl --fail --silent http://localhost:8080/health/ready >/dev/null
      - name: Tests
        run: pnpm test
      - name: Upload CI evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ci-evidence-${{ github.run_id }}
          path: |
            /tmp/spaartrack-api.log
            /tmp/spaartrack-api.pid
          if-no-files-found: warn

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.5
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v3
        if: github.event_name != 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: 8.24.3
      # The action derives the push range from the payload's first commit and
      # hardcodes `--no-merges --first-parent`, so a merge-commit push collapses
      # to zero scanned commits (run 39425432922 reported "0 commits scanned").
      # The push path therefore scans the explicit before..after range itself
      # and fails when that range holds no scannable commit, so a collapsed
      # range can never report a vacuous green again.
      - name: Push secret scan
        if: github.event_name == 'push'
        env:
          GITLEAKS_VERSION: 8.24.3
          GITLEAKS_SHA256_LINUX_X64: 9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c
          GITLEAKS_SHA256_LINUX_ARM64: 5f2edbe1f49f7b920f9e06e90759947d3c5dfc16f752fb93aaafc17e9d14cf07
          SCAN_BASE: ${{ github.event.before }}
          SCAN_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail

          case "$(uname -m)" in
            x86_64)
              asset="linux_x64"
              expected_sha="$GITLEAKS_SHA256_LINUX_X64"
              ;;
            aarch64 | arm64)
              asset="linux_arm64"
              expected_sha="$GITLEAKS_SHA256_LINUX_ARM64"
              ;;
            *)
              echo "::error::unsupported runner architecture $(uname -m)"
              exit 1
              ;;
          esac

          install_dir="$(mktemp -d)"
          archive="gitleaks_${GITLEAKS_VERSION}_${asset}.tar.gz"
          curl --fail --silent --show-error --location \
            --output "${install_dir}/${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${expected_sha}  ${install_dir}/${archive}" | sha256sum --check --strict
          tar --extract --gzip --file "${install_dir}/${archive}" --directory "${install_dir}" gitleaks

          if [ "$SCAN_BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "::error::push event carries no before SHA; refusing to scan an unknown range"
            exit 1
          fi

          for sha in "$SCAN_BASE" "$SCAN_HEAD"; do
            if ! git rev-parse --verify --quiet "${sha}^{commit}" >/dev/null; then
              echo "::error::commit ${sha} is not present in the checked-out history; refusing to scan an unresolved range"
              exit 1
            fi
          done

          commits="$(git rev-list --count "${SCAN_BASE}..${SCAN_HEAD}")"
          if [ "$commits" -lt 1 ]; then
            echo "::error::push range ${SCAN_BASE}..${SCAN_HEAD} holds ${commits} commits; refusing to report a vacuous secret scan"
            exit 1
          fi

          # Render every merge commit's own diff against its first parent, so a
          # secret that only exists in a merge resolution is caught as well.
          # This is a diff-rendering option, not a walk restriction: the walk
          # still covers both parents of each merge. Restricting the walk to
          # the first-parent line instead would drop the merged branch and
          # collapse this range to zero commits on a merge-commit push.
          scan_log="${install_dir}/scan.log"
          status=0
          "${install_dir}/gitleaks" git \
            --no-banner \
            --redact \
            --exit-code=2 \
            --report-format=sarif \
            --report-path=results.sarif \
            --log-level=info \
            --log-opts="--diff-merges=first-parent ${SCAN_BASE}..${SCAN_HEAD}" \
            . 2>&1 | tee "${scan_log}" || status="${PIPESTATUS[0]}"

          if [ "$status" -eq 2 ]; then
            echo "::error::gitleaks detected secrets in the pushed commits"
            exit 1
          fi
          if [ "$status" -ne 0 ]; then
            echo "::error::gitleaks failed to scan the pushed commits (exit ${status})"
            exit "$status"
          fi

          scanned="$(awk 'match($0, /[0-9]+ commits scanned/) { print substr($0, RSTART, RLENGTH); exit }' "${scan_log}" | cut -d" " -f1)"
          if [ -z "$scanned" ] || [ "$scanned" -lt 1 ]; then
            echo "::error::gitleaks scanned ${scanned:-0} commits in ${SCAN_BASE}..${SCAN_HEAD}; refusing to report a vacuous secret scan"
            exit 1
          fi
          echo "secret scan covered ${scanned} commit(s) in ${SCAN_BASE}..${SCAN_HEAD}"
      - name: Upload secret scan report
        if: always() && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-results.sarif
          path: results.sarif
          if-no-files-found: warn
      - name: Dependency audit
        run: pnpm audit --audit-level high

      # SAST gate — semgrep with p/ci ruleset, strict failure on findings
      # Excludes 4 rules conflicting with documented repo conventions:
      # - github-actions-mutable-action-tag: repo pins actions to major versions by deliberate,
      #   test-enforced convention (ci-workflow.test.mjs asserts actions/checkout@vN with major>=5;
      #   pinning exact major broke on runtime bumps). SHA-pinning would break that contract.
      # - pnpm-block-exotic-sub-dependencies, pnpm-missing-minimum-release-age, pnpm-trust-policy:
      #   require pnpm>=10 workspace settings (minimumReleaseAge, trustPolicy, blockExoticSubDeps);
      #   repo pins pnpm@9.15.5 which does not support these settings.
      - name: SAST (Semgrep)
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep:1.181.0 \
            semgrep scan --config p/ci --error --sarif -o semgrep.sarif \
            --exclude-rule yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag \
            --exclude-rule package_managers.pnpm.pnpm-block-exotic-sub-dependencies.pnpm-block-exotic-sub-dependencies \
            --exclude-rule package_managers.pnpm.pnpm-missing-minimum-release-age.pnpm-minimum-release-age \
            --exclude-rule package_managers.pnpm.pnpm-trust-policy.pnpm-trust-policy \
            .

      - name: Upload SAST SARIF
        if: ${{ always() && hashFiles('semgrep.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  image:
    needs: [verify, security]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: true
      matrix:
        service: [web, api, worker]
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - name: Build immutable ${{ matrix.service }} image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          tags: spaartrack/${{ matrix.service }}:${{ github.sha }}
          load: true
          build-args: |
            VCS_REF=${{ github.sha }}
            APP_VERSION=${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.sha }}
          outputs: type=oci,dest=/tmp/spaartrack-${{ matrix.service }}.tar
          sbom: true
          provenance: mode=max
      - name: Record digest evidence
        env:
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
          BUILD_METADATA: ${{ steps.build.outputs.metadata }}
        run: |
          set -eu
          service="${{ matrix.service }}"
          printf '%s\n' "$BUILD_METADATA" > "/tmp/spaartrack-${service}.metadata.json"
          printf '%s\n' "$BUILD_DIGEST" > "/tmp/spaartrack-${service}.digest.txt"
          printf '{"service":"%s","digest":"%s","commit_sha":"%s","tag":"%s"}\n' \
            "$service" "$BUILD_DIGEST" "${{ github.sha }}" \
            "spaartrack/${service}:${{ github.sha }}" \
            > "/tmp/spaartrack-${service}.digest.json"
          test -s "/tmp/spaartrack-${service}.metadata.json"
          test -s "/tmp/spaartrack-${service}.digest.txt"
          test -s "/tmp/spaartrack-${service}.digest.json"
          cat "/tmp/spaartrack-${service}.digest.json"

      # Container scan gate — Trivy scan of the locally-loaded image
      # Scans the exact image reference produced by the build step (spaartrack/<svc>:<sha>)
      # using the local Docker daemon. Fails on HIGH/CRITICAL, uploads SARIF.
      # Uses .trivyignore.yaml baseline for inherited base-image CVEs (with expiry dates).
      - name: Scan ${{ matrix.service }} image (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: spaartrack/${{ matrix.service }}:${{ github.sha }}
          docker-host: unix:///var/run/docker.sock
          format: sarif
          output: trivy-${{ matrix.service }}.sarif
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: false
          limit-severities-for-sarif: true
          trivyignores: .trivyignore.yaml
          scanners: vuln

      - name: Upload Trivy SARIF
        if: ${{ always() && hashFiles('trivy-*.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
          category: trivy-${{ matrix.service }}

      - name: Upload image evidence
        uses: actions/upload-artifact@v4
        with:
          name: image-evidence-${{ github.run_id }}-${{ matrix.service }}
          path: |
            /tmp/spaartrack-${{ matrix.service }}.tar
            /tmp/spaartrack-${{ matrix.service }}.metadata.json
            /tmp/spaartrack-${{ matrix.service }}.digest.txt
            /tmp/spaartrack-${{ matrix.service }}.digest.json
          if-no-files-found: error
