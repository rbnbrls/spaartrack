name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # Poort B (ISSUE-11) decision: this job now boots the repo's own
    # compose.yaml (docker compose up -d --build) instead of ad-hoc
    # services: postgres/redis + bare `pnpm start`. The runner therefore
    # proves the same topology that `docker compose up -d` uses locally
    # (web, api, worker, broker-worker, db, redis, object-storage,
    # otel-collector, prometheus, grafana). Alternative considered -- keep
    # services: and add missing containers -- was rejected because it would
    # maintain two divergent topologies and hide compose wiring drift.
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.5
      - run: pnpm install --frozen-lockfile=true

      # Generate a random per-run synthetic fixture key and inject it into
      # both the compose stack and the test process. This implements the
      # security ruling t_06c724c0 (Option A): the key is never committed,
      # the stack and tests agree by construction, and the helper
      # (tests/helpers/fixture-key.mjs) fails loudly when unset.
      - name: Generate per-run synthetic fixture key
        run: |
          set -euo pipefail
          key="$(node -e "console.log(require('crypto').randomBytes(32).toString('hex'))")"
          echo "SYNTHETIC_FIXTURE_KEY=$key" >> "$GITHUB_ENV"
          echo "::add-mask::$key"

      - name: Build and start compose stack
        env:
          SYNTHETIC_FIXTURE_KEY: ${{ env.SYNTHETIC_FIXTURE_KEY }}
        run: |
          docker compose up -d --build
          docker compose ps

      - name: Validate database schema
        run: |
          for attempt in $(seq 1 20); do
            PGPASSWORD=change-me-local-only psql "postgres://spaartrack:***@localhost:55432/spaartrack" -c "select 1" >/dev/null 2>&1 && break
            sleep 1
          done
          PGPASSWORD=change-me-local-only psql "postgres://spaartrack:***@localhost:55432/spaartrack" -v ON_ERROR_STOP=1 -f database/schema.sql

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build API
        run: pnpm --filter @spaartrack/api build

      - name: Wait for stack readiness
        run: |
          set -eu
          deadline=120
          interval=2
          elapsed=0
          echo "waiting for /health/ready (deadline ${deadline}s, interval ${interval}s)"
          while [ "$elapsed" -lt "$deadline" ]; do
            if curl --fail --silent http://localhost:18080/health/ready >/dev/null 2>&1; then
              echo "stack ready after ${elapsed}s"
              curl --fail --silent http://localhost:18080/health/ready
              exit 0
            fi
            sleep "$interval"
            elapsed=$((elapsed + interval))
            echo "still waiting... ${elapsed}s elapsed (timeout ${deadline}s)"
          done
          echo "stack did not become ready within ${deadline}s"
          docker compose logs --tail=200
          docker compose ps
          exit 1

      - name: Tests
        run: pnpm test

      - name: Stack runtime tests
        env:
          STACK_SMOKE: "1"
          API_URL: http://localhost:18080
          WEB_URL: http://localhost:3000
          S3_ENDPOINT: http://localhost:19000
        run: pnpm test

      - name: Upload CI evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ci-evidence-${{ github.run_id }}
          path: |
            /tmp/spaartrack-api.log
            /tmp/spaartrack-api.pid
          if-no-files-found: warn

      - name: Collect compose logs on failure
        if: ${{ always() }}
        run: |
          docker compose logs --tail=500 > /tmp/compose-logs.txt 2>&1 || echo "compose logs unavailable"
          docker compose ps > /tmp/compose-ps.txt 2>&1 || echo "compose ps unavailable"

      - name: Teardown compose stack
        if: ${{ always() }}
        run: docker compose down -v --remove-orphans
  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.5
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v3
        if: github.event_name != "push"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: 8.24.3
      - name: Dependency audit
        run: pnpm audit --audit-level high

      # SAST gate -- semgrep with p/ci ruleset, strict failure on findings
      # Excludes 4 rules conflicting with documented repo conventions:
      # - github-actions-mutable-action-tag: repo pins actions to major versions by deliberate,
      #   test-enforced convention (ci-workflow.test.mjs asserts actions/checkout@vN with major>=5;
      #   pinning exact major broke on runtime bumps). SHA-pinning would break that contract.
      # - pnpm-block-exotic-sub-dependencies, pnpm-missing-minimum-release-age, pnpm-trust-policy:
      #   require pnpm>=10 workspace settings (minimumReleaseAge, trustPolicy, blockExoticSubDeps);
      #   repo pins pnpm@9.15.5 which does not support these settings.
      - name: SAST (Semgrep)
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep:1.181.0 \
            semgrep scan --config p/ci --error --sarif -o semgrep.sarif \
            --exclude-rule yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag \
            --exclude-rule package_managers.pnpm.pnpm-block-exotic-sub-dependencies.pnpm-block-exotic-sub-dependencies \
            --exclude-rule package_managers.pnpm.pnpm-missing-minimum-release-age.pnpm-minimum-release-age \
            --exclude-rule package_managers.pnpm.pnpm-trust-policy.pnpm-trust-policy \
            .

      - name: Upload SAST SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep
  image:
    needs: [verify, security]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        service: [web, api, worker]
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - name: Build immutable image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          tags: spaartrack/${{ matrix.service }}:${{ github.sha }}
          outputs: type=oci,dest=/tmp/spaartrack-${{ matrix.service }}.tar
          sbom: true
          provenance: mode=max

      - name: Record digest evidence
        env:
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
          BUILD_METADATA: ${{ steps.build.outputs.metadata }}
        run: |
          set -eu
          service="${{ matrix.service }}"
          printf '%s\n' "$BUILD_METADATA" > "/tmp/spaartrack-${service}.metadata.json"
          printf '%s\n' "$BUILD_DIGEST" > "/tmp/spaartrack-${service}.digest.txt"
          printf '{"service":"%s","digest":"%s","commit_sha":"%s","tag":"%s"}\n' \
            "$service" "$BUILD_DIGEST" "${{ github.sha }}" \
            "spaartrack/${service}:${{ github.sha }}" \
            > "/tmp/spaartrack-${service}.digest.json"
          test -s "/tmp/spaartrack-${service}.metadata.json"
          test -s "/tmp/spaartrack-${service}.digest.txt"
          test -s "/tmp/spaartrack-${service}.digest.json"
          cat "/tmp/spaartrack-${service}.digest.json"

      # The pinned scan action resolves its `path` input as `dir:<path>`, so
      # Grype needs the OCI layout as a directory, not the archive file.
      # Unpack the archive this job just built (no rebuild, no retag, no
      # registry push) so the scanner reads exactly the artifact the digest
      # evidence above was recorded for.
      - name: Prepare OCI layout for scanning
        run: |
          set -eu
          service="${{ matrix.service }}"
          layout="/tmp/spaartrack-${service}.tar.oci"
          mkdir -p "$layout"
          tar --extract --file "/tmp/spaartrack-${service}.tar" --directory "$layout"
          test -s "$layout/index.json"

      - name: Scan image
        id: scan
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          path: /tmp/spaartrack-${{ matrix.service }}.tar.oci
          fail-build: true
          severity-cutoff: high
          output-format: sarif
          output-file: /tmp/spaartrack-${{ matrix.service }}.sarif
          only-fixed: false
          cache-db: true

      - name: Upload image evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: image-evidence-${{ github.run_id }}-${{ matrix.service }}
          path: |
            /tmp/spaartrack-${{ matrix.service }}.tar
            /tmp/spaartrack-${{ matrix.service }}.metadata.json
            /tmp/spaartrack-${{ matrix.service }}.digest.txt
            /tmp/spaartrack-${{ matrix.service }}.digest.json
            /tmp/spaartrack-${{ matrix.service }}.sarif
          if-no-files-found: error
