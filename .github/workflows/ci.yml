name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # Poort B (ISSUE-11) decision: this job now boots the repo's own
    # compose.yaml (docker compose up -d --build) instead of ad-hoc
    # services: postgres/redis + bare `pnpm start`. The runner therefore
    # proves the same topology that `docker compose up -d` uses locally
    # (web, api, worker, broker-worker, db, redis, object-storage,
    # otel-collector, prometheus, grafana). Alternative considered -- keep
    # services: and add missing containers -- was rejected because it would
    # maintain two divergent topologies and hide compose wiring drift.
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.5
      - run: pnpm install --frozen-lockfile=true

      # Generate a random per-run synthetic fixture key and inject it into
      # both the compose stack and the test process. This implements the
      # security ruling t_06c724c0 (Option A): the key is never committed,
      # the stack and tests agree by construction, and the helper
      # (tests/helpers/fixture-key.mjs) fails loudly when unset.
      - name: Generate per-run synthetic fixture key
        run: |
          set -euo pipefail
          key="$(node -e "console.log(require('crypto').randomBytes(32).toString('hex'))")"
          echo "SYNTHETIC_FIXTURE_KEY=$key" >> "$GITHUB_ENV"
          echo "::add-mask::$key"

      - name: Build and start compose stack
        env:
          SYNTHETIC_FIXTURE_KEY: ${{ env.SYNTHETIC_FIXTURE_KEY }}
        run: |
          docker compose up -d --build
          docker compose ps

      - name: Validate database schema
        run: |
          for attempt in $(seq 1 20); do
            PGPASSWORD=change-me-local-only psql "postgres://spaartrack:***@localhost:55432/spaartrack" -c "select 1" >/dev/null 2>&1 && break
            sleep 1
          done
          PGPASSWORD=change-me-local-only psql "postgres://spaartrack:***@localhost:55432/spaartrack" -v ON_ERROR_STOP=1 -f database/schema.sql

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build API
        run: pnpm --filter @spaartrack/api build

      - name: Wait for stack readiness
        run: |
          set -eu
          deadline=120
          interval=2
          elapsed=0
          echo "waiting for /health/ready (deadline ${deadline}s, interval ${interval}s)"
          while [ "$elapsed" -lt "$deadline" ]; do
            if curl --fail --silent http://localhost:18080/health/ready >/dev/null 2>&1; then
              echo "stack ready after ${elapsed}s"
              curl --fail --silent http://localhost:18080/health/ready
              exit 0
            fi
            sleep "$interval"
            elapsed=$((elapsed + interval))
            echo "still waiting... ${elapsed}s elapsed (timeout ${deadline}s)"
          done
          echo "stack did not become ready within ${deadline}s"
          docker compose logs --tail=200
          docker compose ps
          exit 1

      - name: Tests
        run: pnpm test

      - name: Stack runtime tests
        env:
          STACK_SMOKE: "1"
          API_URL: http://localhost:18080
          WEB_URL: http://localhost:3000
          S3_ENDPOINT: http://localhost:19000
        run: pnpm test

      - name: Upload CI evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ci-evidence-${{ github.run_id }}
          path: |
            /tmp/spaartrack-api.log
            /tmp/spaartrack-api.pid
          if-no-files-found: warn

      - name: Collect compose logs on failure
        if: ${{ always() }}
        run: |
          docker compose logs --tail=500 > /tmp/compose-logs.txt 2>&1 || echo "compose logs unavailable"
          docker compose ps > /tmp/compose-ps.txt 2>&1 || echo "compose ps unavailable"

      - name: Teardown compose stack
        if: ${{ always() }}
        run: docker compose down -v --remove-orphans

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.5
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v3
        if: github.event_name != 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: 8.24.3
      # The action derives the push range from the payload's first commit and
      # hardcodes `--no-merges --first-parent`, so a merge-commit push collapses
      # to zero scanned commits (run 39425432922 reported "0 commits scanned").
      # The push path therefore scans the explicit before..after range itself
      # and fails when that range holds no scannable commit, so a collapsed
      # range can never report a vacuous green again.
      - name: Push secret scan
        if: github.event_name == 'push'
        env:
          GITLEAKS_VERSION: 8.24.3
          GITLEAKS_SHA256_LINUX_X64: 9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c
          GITLEAKS_SHA256_LINUX_ARM64: 5f2edbe1f49f7b920f9e06e90759947d3c5dfc16f752fb93aaafc17e9d14cf07
          SCAN_BASE: ${{ github.event.before }}
          SCAN_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail

          case "$(uname -m)" in
            x86_64)
              asset="linux_x64"
              expected_sha="$GITLEAKS_SHA256_LINUX_X64"
              ;;
            aarch64 | arm64)
              asset="linux_arm64"
              expected_sha="$GITLEAKS_SHA256_LINUX_ARM64"
              ;;
            *)
              echo "::error::unsupported runner architecture $(uname -m)"
              exit 1
              ;;
          esac

          install_dir="$(mktemp -d)"
          archive="gitleaks_${GITLEAKS_VERSION}_${asset}.tar.gz"
          curl --fail --silent --show-error --location \
            --output "${install_dir}/${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${expected_sha}  ${install_dir}/${archive}" | sha256sum --check --strict
          tar --extract --gzip --file "${install_dir}/${archive}" --directory "${install_dir}" gitleaks

          if [ "$SCAN_BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "::error::push event carries no before SHA; refusing to scan an unknown range"
            exit 1
          fi

          for sha in "$SCAN_BASE" "$SCAN_HEAD"; do
            if ! git rev-parse --verify --quiet "${sha}^{commit}" >/dev/null; then
              echo "::error::commit ${sha} is not present in the checked-out history; refusing to scan an unresolved range"
              exit 1
            fi
          done

          commits="$(git rev-list --count "${SCAN_BASE}..${SCAN_HEAD}")"
          if [ "$commits" -lt 1 ]; then
            echo "::error::push range ${SCAN_BASE}..${SCAN_HEAD} holds ${commits} commits; refusing to report a vacuous secret scan"
            exit 1
          fi

          # Render every merge commit's own diff against its first parent, so a
          # secret that only exists in a merge resolution is caught as well.
          # This is a diff-rendering option, not a walk restriction: the walk
          # still covers both parents of each merge. Restricting the walk to
          # the first-parent line instead would drop the merged branch and
          # collapse this range to zero commits on a merge-commit push.
          scan_log="${install_dir}/scan.log"
          status=0
          "${install_dir}/gitleaks" git \
            --no-banner \
            --redact \
            --exit-code=2 \
            --report-format=sarif \
            --report-path=results.sarif \
            --log-level=info \
            --log-opts="--diff-merges=first-parent ${SCAN_BASE}..${SCAN_HEAD}" \
            . 2>&1 | tee "${scan_log}" || status="${PIPESTATUS[0]}"

          if [ "$status" -eq 2 ]; then
            echo "::error::gitleaks detected secrets in the pushed commits"
            exit 1
          fi
          if [ "$status" -ne 0 ]; then
            echo "::error::gitleaks failed to scan the pushed commits (exit ${status})"
            exit "$status"
          fi

          scanned="$(awk 'match($0, /[0-9]+ commits scanned/) { print substr($0, RSTART, RLENGTH); exit }' "${scan_log}" | cut -d" " -f1)"
          if [ -z "$scanned" ] || [ "$scanned" -lt 1 ]; then
            echo "::error::gitleaks scanned ${scanned:-0} commits in ${SCAN_BASE}..${SCAN_HEAD}; refusing to report a vacuous secret scan"
            exit 1
          fi
          echo "secret scan covered ${scanned} commit(s) in ${SCAN_BASE}..${SCAN_HEAD}"
      - name: Upload secret scan report
        if: always() && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-results.sarif
          path: results.sarif
          if-no-files-found: warn
      - name: Dependency audit
        run: pnpm audit --audit-level high

  image:
    needs: [verify, security]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        service: [web, api, worker]
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - name: Build immutable ${{ matrix.service }} image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          tags: spaartrack/${{ matrix.service }}:${{ github.sha }}
          build-args: |
            VCS_REF=${{ github.sha }}
            APP_VERSION=${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.sha }}
          outputs: type=oci,dest=/tmp/spaartrack-${{ matrix.service }}.tar
          sbom: true
          provenance: mode=max
      - name: Record digest evidence
        env:
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
          BUILD_METADATA: ${{ steps.build.outputs.metadata }}
        run: |
          set -eu
          service="${{ matrix.service }}"
          printf '%s\n' "$BUILD_METADATA" > "/tmp/spaartrack-${service}.metadata.json"
          printf '%s\n' "$BUILD_DIGEST" > "/tmp/spaartrack-${service}.digest.txt"
          printf '{"service":"%s","digest":"%s","commit_sha":"%s","tag":"%s"}\n' \
            "$service" "$BUILD_DIGEST" "${{ github.sha }}" \
            "spaartrack/${service}:${{ github.sha }}" \
            > "/tmp/spaartrack-${service}.digest.json"
          test -s "/tmp/spaartrack-${service}.metadata.json"
          test -s "/tmp/spaartrack-${service}.digest.txt"
          test -s "/tmp/spaartrack-${service}.digest.json"
          cat "/tmp/spaartrack-${service}.digest.json"
      - name: Upload image evidence
        uses: actions/upload-artifact@v4
        with:
          name: image-evidence-${{ github.run_id }}-${{ matrix.service }}
          path: |
            /tmp/spaartrack-${{ matrix.service }}.tar
            /tmp/spaartrack-${{ matrix.service }}.metadata.json
            /tmp/spaartrack-${{ matrix.service }}.digest.txt
            /tmp/spaartrack-${{ matrix.service }}.digest.json
          if-no-files-found: error
